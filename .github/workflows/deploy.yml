name: Deploy to Oracle

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build deployment artifact
        run: |
          bash -n scripts/r2-ops scripts/deploy-app.sh
          bash scripts/tests/test-r2-ops.sh
          bash scripts/tests/test-deploy-app.sh
          bash scripts/tests/test-deploy-process.sh
          bash ./gradlew clean build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
          if-no-files-found: warn

      - name: Deploy verified artifact
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.GCP_SSH_KEY }}
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          HEALTH_URL=${HEALTH_URL:-http://127.0.0.1:8080/health/ready}
          [[ "$HEALTH_URL" =~ ^http://127\.0\.0\.1:[0-9]+/health/ready$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          opts=(-i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          incoming="deploy-incoming/$release"
          mkdir -p staging
          cp build/libs/yeogidot-0.0.1-SNAPSHOT.jar staging/yeogidot.jar
          cp scripts/r2-ops scripts/deploy-app.sh staging/
          (cd staging && sha256sum yeogidot.jar r2-ops deploy-app.sh > SHA256SUMS)
          ssh "${opts[@]}" "$remote" "umask 077; mkdir -p '$incoming'"
          scp "${opts[@]}" staging/* "$remote:$incoming/"
          ssh "${opts[@]}" "$remote" "cd '$incoming' && sha256sum --check SHA256SUMS && bash -n deploy-app.sh && bash deploy-app.sh \"\$HOME/app\" \"\$HOME/$incoming\" '$release' '$HEALTH_URL'"
