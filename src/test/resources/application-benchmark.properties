spring.datasource.url=jdbc:mysql://${BENCHMARK_DB_HOST:127.0.0.1}:${BENCHMARK_DB_PORT:3306}/yeogidot_benchmark?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${BENCHMARK_DB_USERNAME}
spring.datasource.password=${BENCHMARK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This profile is allowed to recreate tables only in the dedicated yeogidot_benchmark schema above.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.show-sql=false
spring.cache.type=none

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
